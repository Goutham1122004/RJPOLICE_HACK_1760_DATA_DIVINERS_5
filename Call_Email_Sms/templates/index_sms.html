<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Spam Classifier</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8sh+WyDPm9W/iL2vUE/mI5QF7soF7gT1eflRy" crossorigin="anonymous">
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            box-sizing: border-box;
            height: 100%;
            background-color: #000000;
            background-image: radial-gradient(#11581E, #041607), url("https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif");
            background-repeat: no-repeat;
            background-size: cover;
            justify-content: center;
            font-family: 'Inconsolata', Helvetica, sans-serif;
            font-size: 1.5rem;
            color: rgba(128, 255, 128, 0.8);
            text-shadow:
                0 0 1ex rgba(51, 255, 51, 1),
                0 0 2px rgba(255, 255, 255, 0.8);
            transition: background-color 1s, box-shadow 1s; /* Smooth transition effect */
        }

        .noise {
            pointer-events: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url("https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif");
            background-repeat: no-repeat;
            background-size: cover;
            z-index: -1;
            opacity: .02;
        }

        .overlay {
            pointer-events: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(
                180deg,
                rgba(0, 0, 0, 0) 0,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0) 100%);
            background-size: auto 4px;
            z-index: 1;
        }

        .overlay::before {
            content: "";
            pointer-events: none;
            position: absolute;
            display: block;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(
                0deg,
                transparent 0%,
                rgba(32, 128, 32, 0.2) 2%,
                rgba(32, 128, 32, 0.8) 3%,
                rgba(32, 128, 32, 0.2) 3%,
                transparent 100%);
            background-repeat: no-repeat;
            animation: scan 7.5s linear 0s infinite;
        }

        @keyframes scan {
            0%        { background-position: 0 -100vh; }
            35%, 100% { background-position: 0 100vh; }
        }

        .terminal {
            box-sizing: inherit;
            position: absolute;
            height: 100%;
            width: 1000px;
            max-width: 200%;
            padding: 4rem;
            padding-left: 30rem;
            text-transform: uppercase;
        }

        .output {
            text-shadow:
                0 0 1px rgba(51, 255, 51, 0.4),
                0 0 2px rgba(255, 255, 255, 0.8);
        }

        .output::before {
            content: "> ";
        }

        .container {
            margin-top: 20px;
            text-align: center;
            background-color: #0000000;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .card {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border: none;
            border-radius: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        textarea {
            resize: vertical;
            width: 100%;
            padding: 15px; /* Adjust as needed */
            font-size: 18px; /* Adjust as needed */
        }

        .btn-primary {
            background-color: #0F1035;
            border-color: #007bff;
            width: 100%;
            color: white;
            padding: 20px; /* Adjust as needed */
            font-size: 20px; /* Adjust as needed */
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div class="overlay"></div>
   <center>
    <div class="jumbotron text-center">
        <h1 class="display-4"><b>SMS Spam Classifier</b></h1>
        <p class="lead"><b>Enter your SMS messsage to check if it's spam or not.</b></p>
    </div>
</center>

    <div class="container">
        <div class="card">
            <form onsubmit="predictEmail(event)">
                <div class="form-group">
                    <label for="email"><b>Enter SMS message:</b></label>
                    <textarea class="form-control" id="email" rows="4" placeholder="Type your email here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary"><b>Predict</b></button>
            </form>
        </div>

        <div id="predictionResult" class="alert" role="alert"></div>
    </div>

    <script>
        function predictEmail(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;

            // Fetch API to send email data to Flask backend
            fetch('/api/predict1', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ content: email }),
            })
            .then(response => response.json())
            .then(data => {
                // Display the prediction result
                const predictionResult = document.getElementById('predictionResult');
                predictionResult.innerHTML = `
                    <h4 class="alert-heading">Prediction: ${data.prediction}</h4>
                    <p>SMS Content: ${data.email}</p>
                `;

                // Change background color and shadow
                document.body.style.backgroundColor = '#00FF00'; // Green background
                document.body.style.boxShadow = '0 0 20px rgba(0, 255, 0, 0.5)'; // Green shadow
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8sh+WyDPm9W/iL2vUE/mI5QF7soF7gT1eflRy" crossorigin="anonymous"></script>
</body>
</html>
